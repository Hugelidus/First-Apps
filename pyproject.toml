[project]
name = "cinemaia-kraken"
version = "0.1.0"
description = "CinemaIA MVP1 — chat RAG sobre la película 'Kraken. El libro negro de las horas'."
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Hugelidus" }]
license = { text = "Proprietary" }

dependencies = [
    "anthropic>=0.40.0",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.3.0",
    "httpx>=0.27.0",
    "selectolax>=0.3.21",
    "beautifulsoup4>=4.12.3",
    "rank-bm25>=0.2.2",
    "typer>=0.15.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "tiktoken>=0.8.0",
    "numpy>=1.26.0",
]

[project.scripts]
cinemaia = "src.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
